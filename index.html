<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Now Hiring, Monaco Bay Development</title>
<meta name="description" content="Now hiring concrete workers and lawn and turf workers in Titusville. $17 to $41 an hour, based on experience. Text your resume to Eddie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A1B3C; --gold: #D4AF5A; }
  * { box-sizing: border-box; }
  html { margin: 0; min-height: 100%; background: var(--navy); }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    font-family: 'Montserrat', Arial, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(90% 42% at 50% 62%, #15315F 0%, rgba(10,27,60,0) 100%), var(--navy);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 22px 40px; }
  .logo { display: block; width: 170px; max-width: 52%; height: auto; margin: 0 auto 22px; }
  h1 { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: 1px; color: var(--gold); margin: 0 0 14px; }
  .jobs { font-weight: 800; font-size: 21px; line-height: 1.4; letter-spacing: .5px; margin: 0; }
  .plate {
    background: linear-gradient(180deg, #F1D892 0%, #D4AF5A 55%, #B48C3A 100%);
    box-shadow: inset 0 0 0 3px rgba(241,216,146,.85), inset 0 0 0 4.5px var(--navy);
    color: var(--navy); border-radius: 14px;
  }
  .pay { display: inline-block; margin: 22px 0 0; padding: 12px 26px 11px; }
  .pay b { display: block; font-weight: 800; font-size: 25px; line-height: 1.1; }
  .pay small { display: block; font-weight: 700; font-size: 11.5px; letter-spacing: 2.5px; margin-top: 5px; }
  .line { font-weight: 500; font-size: 17px; line-height: 1.5; color: #E3E8F1; margin: 22px auto 26px; max-width: 400px; }
  .btn {
    display: block; max-width: 420px; margin: 0 auto; padding: 19px 14px;
    font-weight: 800; font-size: 20px; letter-spacing: .3px; text-decoration: none;
    box-shadow: inset 0 0 0 3px rgba(241,216,146,.85), inset 0 0 0 4.5px var(--navy), 0 8px 26px rgba(212,175,90,.22);
  }
  .btn:active { filter: brightness(.95); }
  .num { display: inline-block; margin: 18px 0 4px; color: #fff; font-weight: 700; font-size: 24px; letter-spacing: 1px; text-decoration: none; }
  .small { font-weight: 500; font-size: 15px; line-height: 1.5; color: #B8C4D9; margin: 8px auto 0; max-width: 380px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Monaco Bay Development">
  <h1>NOW HIRING</h1>
  <p class="jobs">CONCRETE WORKERS<br>LAWN AND TURF WORKERS</p>
  <div class="pay plate"><b>$17 to $41 an hour</b><small>BASED ON EXPERIENCE</small></div>
  <p class="line">You'd work right under Eddie, the owner, and start on a new RV resort off US 1 in Titusville.</p>
  <a class="btn plate" href="sms:+16452489431?&amp;body=Hi%20Eddie%2C%20I%20saw%20your%20hiring%20ad%20and%20want%20to%20apply.">Text your resume to Eddie</a>
  <a class="num" href="sms:+16452489431?&amp;body=Hi%20Eddie%2C%20I%20saw%20your%20hiring%20ad%20and%20want%20to%20apply.">(645) 248-9431</a>
  <p class="small">No resume? Text your name, the work you've done and when you can start.</p>
</main>
</body>
</html>
